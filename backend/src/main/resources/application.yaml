spring:
  application:
    name: lineup-api

  profiles:
    default: dev

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

lineup:
  jwt:
    # Chave de assinatura em base64. Gere com: openssl rand -base64 48
    segredo: ${LINEUP_JWT_SEGREDO}
    validade-do-access-token: 15m
