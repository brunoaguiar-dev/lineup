spring:
  application:
    name: lineup-api

  datasource:
    url: jdbc:postgresql://localhost:5432/lineup
    username: lineup
    password: lineup

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
