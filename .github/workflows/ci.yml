name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: backend/pom.xml

      # O runner já vem com Docker, que é o que o Testcontainers usa para subir
      # o Postgres dos testes de persistência.
      - name: Testes
        working-directory: backend
        run: ./mvnw -B test
